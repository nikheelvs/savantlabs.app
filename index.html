<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savant Labs</title>
  <meta name="description" content="Savant Labs builds smart mobile experiences. Discover AuraCast Explorer for Bluetooth LE Audio.">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #050510;
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(0,130,252,0.12) 0%, rgba(0,130,252,0.03) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-bottom {
      position: fixed;
      bottom: -50%;
      left: 30%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,180,216,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .brand {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeDown 0.8s ease;
    }

    .brand h1 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 10px;
    }

    .brand p {
      font-size: 15px;
      color: #4a4a5a;
      font-weight: 400;
    }

    .hero {
      text-align: center;
      max-width: 560px;
      margin-bottom: 48px;
      animation: fadeUp 0.8s ease 0.1s both;
    }

    .hero-icon {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      margin: 0 auto 28px;
      box-shadow: 0 8px 32px rgba(0,130,252,0.25), 0 0 0 1px rgba(255,255,255,0.06);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .hero-icon:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 48px rgba(0,130,252,0.35), 0 0 0 1px rgba(255,255,255,0.1);
    }

    .hero-icon img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hero h2 {
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .hero .subtitle {
      font-size: 17px;
      color: #6a6a7a;
      line-height: 1.6;
      max-width: 420px;
      margin: 0 auto;
    }

    .features {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
      animation: fadeUp 0.8s ease 0.2s both;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      color: #8a8a9a;
      transition: border-color 0.3s, color 0.3s;
    }

    .chip:hover {
      border-color: rgba(0,130,252,0.3);
      color: #aaa;
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0082FC;
      box-shadow: 0 0 8px rgba(0,130,252,0.5);
    }

    .cta {
      animation: fadeUp 0.8s ease 0.3s both;
    }

    .play-link {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, rgba(0,130,252,0.12), rgba(0,130,252,0.06));
      border: 1px solid rgba(0,130,252,0.2);
      border-radius: 14px;
      padding: 14px 28px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.3s, border-color 0.3s, transform 0.2s, box-shadow 0.3s;
    }

    .play-link:hover {
      background: linear-gradient(135deg, rgba(0,130,252,0.2), rgba(0,130,252,0.1));
      border-color: rgba(0,130,252,0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,130,252,0.15);
    }

    .play-link svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .play-text .small {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7a7a8a;
      display: block;
      line-height: 1;
      margin-bottom: 3px;
    }

    .play-text .big {
      display: block;
      line-height: 1;
      font-weight: 600;
    }

    footer {
      position: relative;
      z-index: 1;
      width: 100%;
      text-align: center;
      padding: 32px 24px;
      font-size: 13px;
      color: #2a2a3a;
    }

    footer a {
      color: #3a3a4a;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #0082FC;
    }

    footer .sep {
      margin: 0 10px;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .brand h1 { font-size: 32px; }
      .hero h2 { font-size: 22px; }
      .hero .subtitle { font-size: 15px; }
      .features { gap: 8px; }
      .hero-icon { width: 80px; height: 80px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-bottom"></div>

  <div class="page">
    <div class="brand">
      <h1>Savant Labs</h1>
      <p>Building smart experiences</p>
    </div>

    <div class="hero">
      <div class="hero-icon">
        <img src="icon.png" alt="AuraCast Explorer" width="96" height="96">
      </div>
      <h2>AuraCast Explorer</h2>
      <p class="subtitle">Discover and stream Bluetooth LE Audio broadcasts at airports, gyms, venues, and more.</p>
    </div>

    <div class="features">
      <div class="chip"><div class="chip-dot"></div>Scan broadcasts</div>
      <div class="chip"><div class="chip-dot"></div>Stream audio</div>
      <div class="chip"><div class="chip-dot"></div>Save favorites</div>
    </div>

    <div class="cta">
      <a href="https://play.google.com/store/apps/details?id=com.savantlabs.auracastexplorer" class="play-link">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.61 1.814L13.793 12 3.61 22.186a.996.996 0 01-.61-.92V2.734c0-.382.218-.72.61-.92zM14.5 12.707l2.55 2.55-8.37 4.746 5.82-7.296zM17.256 9.95l2.39 1.396c.552.318.89.862.89 1.45 0 .59-.338 1.134-.89 1.453l-2.18 1.274-2.79-3.523 2.58-2.05zM8.68 4.498l8.37 4.746-2.55 2.55-5.82-7.296z"/>
        </svg>
        <div class="play-text">
          <span class="small">Get it on</span>
          <span class="big">Google Play</span>
        </div>
      </a>
    </div>
  </div>

  <footer>
    &copy; 2026 Savant Labs
    <span class="sep">&middot;</span>
    <a href="mailto:nikheelvs@gmail.com">Contact</a>
  </footer>
</body>
</html>
